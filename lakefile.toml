name = "leantex"
defaultTargets = ["LeanTex", "leantex"]
testDriver = "Tests"
lintDriver = "lint"

[leanOptions]
weak."linter.extra" = true
weak."linter.extra.dupNamespace" = true
weak."linter.extra.unnecessarySeqFocus" = true
weak."linter.extra.unreachableTactic" = true
weak."linter.redundantVisibility" = true
weak."linter.extra.unusedDecidableInType" = true
weak."linter.indexVariables" = true
weak."linter.listVariables" = true
weak."linter.omit" = true
weak."linter.tacticCheckInstances" = true
weak."linter.unusedVariables.analyzeTactics" = true
weak."linter.loopingSimpArgs" = true

[[lean_lib]]
name = "LeanTex"
globs = ["LeanTex", "LeanTex.+"]

# The owed-theorem staging area: statements the engine does not yet earn,
# type-checked, proofs open. Not a default target: `lake build` and
# `lake test` never see it, nothing in LeanTex/ may import it (the
# pre-commit hook and scripts/owed.lean both check), and the ratchet in
# scripts/owed.lean keeps the debt from growing unnamed.
[[lean_lib]]
name = "Obligations"

[[lean_exe]]
name = "leantex"
root = "Main"

[[lean_lib]]
name = "TestsModules"
globs = ["Tests.+"]

[[lean_exe]]
name = "Tests"
root = "Tests"
moreLeancArgs = ["-O0"]

[[lean_exe]]
name = "convProbe"
root = "scripts.convprobe"

[[lean_exe]]
name = "runBoundProbe"
root = "scripts.runboundprobe"

# All maintained tools are compiled, including tools outside the default
# executable targets. Each executable retains its own compiler environment.
[[lean_lib]]
name = "ScriptsModules"
globs = ["scripts.+"]

[[lean_exe]]
name = "proofcheck"
root = "scripts.proofcheck"

[[lean_exe]]
name = "lint"
root = "scripts.lint"

[[lean_exe]]
name = "precommit"
root = "scripts.precommit"

[[lean_exe]]
name = "owed"
root = "scripts.owed"

# Citation checks inspect the compiled environment.
[[lean_exe]]
name = "cites"
root = "scripts.cites"

[[lean_exe]]
name = "scoreboard"
root = "scripts.scoreboard"

[[lean_exe]]
name = "parity"
root = "scripts.parity"

[[lean_exe]]
name = "land"
root = "scripts.land"
