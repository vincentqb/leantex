name = "leantex"
defaultTargets = ["leantex"]
testDriver = "Tests"

[leanOptions]
weak."linter.extra" = true
weak."linter.extra.dupNamespace" = true
weak."linter.extra.unnecessarySeqFocus" = true
weak."linter.extra.unreachableTactic" = true
weak."linter.redundantVisibility" = true
weak."linter.extra.unusedDecidableInType" = true
weak."linter.indexVariables" = true
weak."linter.listVariables" = true
weak."linter.omit" = true
weak."linter.tacticCheckInstances" = true
weak."linter.unusedVariables.analyzeTactics" = true
weak."linter.loopingSimpArgs" = true

[[lean_lib]]
name = "LeanTex"

# The owed-theorem staging area: statements the engine does not yet earn,
# type-checked, proofs open. Not a default target: `lake build` and
# `lake test` never see it, nothing in LeanTex/ may import it (the
# pre-commit hook and scripts/owed.lean both check), and the ratchet in
# scripts/owed.lean keeps the debt from growing unnamed.
[[lean_lib]]
name = "Obligations"

[[lean_exe]]
name = "leantex"
root = "Main"

[[lean_lib]]
name = "TestsModules"
globs = ["Tests.+"]

[[lean_exe]]
name = "Tests"
root = "Tests"
moreLeancArgs = ["-O0"]

# The gate scripts, compiled: the sh trampoline execs the precommit binary
# when it is newer than the scripts (interpreting the 1,000-line script cost
# ~1.9 s of a 2.1 s hook); the gate's own build step refreshes both. GateLib
# carries the helpers the two scripts share.
[[lean_lib]]
name = "GateLib"
globs = ["scripts.Gate"]

[[lean_exe]]
name = "precommit"
root = "scripts.precommit"

[[lean_exe]]
name = "owed"
root = "scripts.owed"

# The citation gate: it resolves a cited theorem name against the compiled
# environment, so it imports the tree at run time rather than linking it.
# Its own build stays independent of whether the library compiles.
[[lean_exe]]
name = "cites"
root = "scripts.cites"

# The scoreboard: one committed baseline per goal, each under a ratchet.
# BoardLib carries the format, the ratchet and the deficit ranking the
# aggregate and every tier producer share; the producers themselves are run
# interpreted (`lake env lean --run scripts/<tier>.lean`), which is the
# convention tier discovery relies on.
[[lean_lib]]
name = "BoardLib"
globs = ["scripts.Board"]

[[lean_exe]]
name = "scoreboard"
root = "scripts.scoreboard"

# The cross-engine parity ladder. Its scripts must agree on the level
# vocabulary, the divergence registry, the sidecar format and the ratchet's
# arithmetic, so they read one module rather than a copy each — the reason
# GateLib exists for the two gate scripts. `scripts/parity-regen.lean`
# invokes the reference engine and is run as the other oracles are
# (`lake env lean --run`); the gate is compiled, because it imports
# test-suite internals other branches edit and nothing else would fail when
# one of them moves, and because interpreting it cost 7.4 s of a gate that
# will grow.
[[lean_lib]]
name = "ParityLib"
globs = ["scripts.ParityCore"]

[[lean_exe]]
name = "parity"
root = "scripts.parity"

# The landing procedure. `LandCore` is its pure core — a state machine over
# observations whose only outputs are actions, with the merge-needs-gates
# theorem; `land` is the boundary that feeds it from files.
[[lean_lib]]
name = "LandLib"
globs = ["scripts.LandCore"]

[[lean_exe]]
name = "land"
root = "scripts.land"
