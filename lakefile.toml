name = "leantex"
defaultTargets = ["LeanTex", "leantex"]
testDriver = "Tests"
lintDriver = "lint"
# Every compiled project declaration must be free of unfinished proofs. The lint
# driver additionally audits compiled axioms and proofs erased after elaboration.
moreLeanArgs = ["-E", "hasSorry"]
# Each name is an option Lean registers, so a linter a toolchain renames or drops fails
# the build instead of going quiet.
leanOptions = [
  ["linter.unusedVariables", true],
  ["linter.unusedVariables.analyzeTactics", true],
  ["linter.extra", true],
  ["linter.omit", true],
]

[[lean_lib]]
name = "LeanTex"
globs = ["LeanTex", "LeanTex.+"]

[[lean_exe]]
name = "leantex"
root = "Main"

[[lean_lib]]
name = "TestsModules"
globs = ["Tests.+"]

[[lean_exe]]
name = "Tests"
root = "Tests"
moreLeancArgs = ["-O0"]

[[lean_exe]]
name = "convProbe"
root = "scripts.convprobe"

[[lean_exe]]
name = "runBoundProbe"
root = "scripts.runboundprobe"

# All maintained tools are compiled, including tools outside the default
# executable targets. Each executable retains its own compiler environment.
[[lean_lib]]
name = "ScriptsModules"
globs = ["scripts.+"]

[[lean_exe]]
name = "proofcheck"
root = "scripts.proofcheck"

[[lean_exe]]
name = "lint"
root = "scripts.lint"

[[lean_exe]]
name = "precommit"
root = "scripts.precommit"

# Citation checks inspect the compiled environment.
[[lean_exe]]
name = "cites"
root = "scripts.cites"

[[lean_exe]]
name = "scoreboard"
root = "scripts.scoreboard"

# The image and PDF figure fuzz oracle, compiled: its importer classes read
# fifty thousand files, which the interpreter takes hours over.
[[lean_exe]]
name = "imgFuzz"
root = "scripts.«img-fuzz»"

[[lean_exe]]
name = "parity"
root = "scripts.parity"

[[lean_exe]]
name = "visualdiff"
root = "scripts.visualdiff"

[[lean_exe]]
name = "land"
root = "scripts.land"

[[lean_exe]]
name = "passBench"
root = "scripts.passbench"
