name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gates read history, not just the tree: the diff checks want
          # the pushed range, and the golden-regeneration check asks for the
          # merge base with the trunk. A depth-1 checkout has neither.
          fetch-depth: 0
      - name: Install image test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin poppler-utils
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          lint: true
          # One strict build, then the standard test and lint drivers.
          # Lint checks every maintained source, compiled axiom closure,
          # anonymous proof and citation, and runs those gates' selftests.
          build-args: "--wfail LeanTex leantex Tests precommit proofcheck lint cites land scoreboard"

      - name: landing and baseline selftests
        run: |
          .lake/build/bin/land --selftest
          .lake/build/bin/land --scratch-selftest
          .lake/build/bin/scoreboard --selftest
      - name: scoreboard ratchet
        run: .lake/build/bin/scoreboard --check
      - name: structural gates
        env:
          # Empty on a push; the target branch on a pull request.
          BASE_REF: ${{ github.base_ref }}
          # The previous tip on a push; all-zeros when the branch is new.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF}" ]; then
            # Three dots: the diff from the merge base, which is the change
            # the pull request proposes rather than the trunk's own moves.
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            RANGE="${BEFORE}..HEAD"
          else
            RANGE=""
          fi
          if [ -n "${RANGE}" ]; then
            echo "gate range: ${RANGE}"
            .lake/build/bin/precommit --range "${RANGE}" --conventions
          else
            # No computable range (a first push, a force-push over a gone
            # commit): the whole-tree gates still run.
            echo "gate range: none, whole tree only"
            .lake/build/bin/precommit --tree --conventions
          fi
