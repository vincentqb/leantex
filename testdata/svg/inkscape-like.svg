<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Invented, in the shape a vector editor writes -->
<svg
   width="120mm"
   height="60mm"
   viewBox="0 0 120 60"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     inkscape:document-units="mm" />
  <defs
     id="defs1">
    <linearGradient
       id="linearGradient2"
       inkscape:collect="always">
      <stop
         style="stop-color:#ffcc00;stop-opacity:1;"
         offset="0"
         id="stop1" />
      <stop
         style="stop-color:#ff6600;stop-opacity:1;"
         offset="1"
         id="stop2" />
    </linearGradient>
    <linearGradient
       inkscape:collect="always"
       xlink:href="#linearGradient2"
       id="linearGradient3"
       x1="10"
       y1="30"
       x2="60"
       y2="30"
       gradientUnits="userSpaceOnUse"
       xmlns:xlink="http://www.w3.org/1999/xlink" />
  </defs>
  <g
     inkscape:label="Layer 1"
     inkscape:groupmode="layer"
     id="layer1">
    <rect
       style="fill:url(#linearGradient3);fill-opacity:1;stroke:#333333;stroke-width:0.8;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"
       id="rect1"
       width="50"
       height="40"
       x="10"
       y="10"
       ry="4" />
    <path
       style="fill:none;stroke:#2255aa;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4;stroke-dasharray:none"
       d="m 70,45 c 8,-25 18,-25 26,0 s 14,-20 18,-5"
       id="path1"
       sodipodi:nodetypes="ccc" />
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:normal;font-size:6.35px;line-height:1.25;font-family:sans-serif;-inkscape-font-specification:sans-serif;fill:#000000;fill-opacity:1;stroke:none"
       x="70"
       y="55"
       id="text1"><tspan
         sodipodi:role="line"
         id="tspan1"
         x="70"
         y="55">Invented curve</tspan></text>
  </g>
</svg>
