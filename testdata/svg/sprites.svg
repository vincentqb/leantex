<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="120" viewBox="0 0 240 120">
  <style>
    .warn { fill: #e8a33d }
    #ramp stop { stop-color: #2b6cb0 }
    #ramp stop.far { stop-color: #9ae6b4 }
  </style>
  <defs>
    <symbol id="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="dot" class="warn" viewBox="0 0 10 10">
      <circle cx="5" cy="5" r="4"/>
    </symbol>
    <linearGradient id="ramp"><stop offset="0"/><stop class="far" offset="1"/></linearGradient>
    <clipPath id="left" clipPathUnits="objectBoundingBox"><rect width="0.5" height="1"/></clipPath>
    <rect id="tile" width="40" height="40" fill="#553c9a"/>
  </defs>
  <rect x="0" y="0" width="240" height="120" fill="#ffffff"/>
  <use href="#tick" x="8" y="8" width="40" height="40" color="#2f855a"/>
  <use xlink:href="#tick" x="56" y="8" width="40" height="40" color="#c53030"/>
  <use href="#dot" x="104" y="8" width="40" height="40"/>
  <rect x="152" y="8" width="80" height="40" fill="url(#ramp)"/>
  <use href="#tile" x="8" y="64" clip-path="url(#left)"/>
  <g clip-path="url(#left)"><rect x="56" y="64" width="40" height="40" fill="#2c7a7b"/></g>
  <svg x="104" y="64" width="60" height="50" transform="translate(4 2)">
    <rect width="40" height="40" fill="#975a16"/>
  </svg>
</svg>
