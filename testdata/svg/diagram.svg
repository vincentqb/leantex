<svg xmlns="http://www.w3.org/2000/svg" width="200" height="90" viewBox="0 0 200 90" font-family="sans-serif" font-size="11">
 <title>An invented two-step diagram</title>
 <g transform="translate(10 20)">
  <rect width="70" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="35" y="24" text-anchor="middle">source</text>
 </g>
 <g transform="translate(120 20)">
  <rect width="70" height="40" rx="6" fill="#fce8e6" stroke="#d93025"/>
  <text x="35" y="24" text-anchor="middle">target</text>
 </g>
 <path d="M 80 40 L 112 40" stroke="#5f6368" stroke-width="1.5" fill="none"/>
 <path d="M 112 36 L 120 40 L 112 44 Z" fill="#5f6368"/>
 <text x="100" y="78" text-anchor="middle" font-size="9" fill="#5f6368"><tspan font-style="italic">one</tspan> step</text>
</svg>
